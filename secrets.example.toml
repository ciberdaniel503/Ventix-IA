# Copia este archivo a .streamlit/secrets.toml y completa con tus valores reales
# NOTA: Nunca commits secrets.toml a Git

# Token del bot de Telegram (obtenido de @BotFather)
TELEGRAM_BOT_TOKEN = "tu-token-de-telegram-aqui"

# Token de acceso personal de GitHub (para persistencia en la nube)
# Crea uno en: GitHub Settings → Developer settings → Personal access tokens
GITHUB_TOKEN = "tu-token-de-github-aqui"

# Repositorio de GitHub para guardar los datos (formato: usuario/nombre-repo)
GITHUB_REPO = "tu-usuario/tu-repositorio"

# Ruta dentro del repositorio donde se guardarán los datos (opcional)
GITHUB_DATA_PATH = "data"
